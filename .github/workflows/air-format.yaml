on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: air-format

permissions: read-all

# Supersede an in-flight run when a PR branch is pushed again: only the newest
# commit's result carries information. Restricted to pull_request so a run on
# the default branch is never cancelled -- that history is what the badge and
# any release audit read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  air-format:
    runs-on: ubuntu-latest
    # Formatting check only; bounded for the same reason as R-CMD-check -- the
    # 6-hour default turns a hung action into 360 wasted runner-minutes.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install Air
        uses: posit-dev/setup-air@v1

      # The whole tree rather than `R tests`, because data-raw/ is formatted
      # here too: air.toml declares no exclude, and `air format .` is the
      # command CLAUDE.md tells contributors to run. Checking a narrower set
      # than that would let data-raw/ drift without CI noticing.
      - name: Check formatting
        run: air format . --check
