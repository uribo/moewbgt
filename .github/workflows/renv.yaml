# Validates the pinned development environment.
#
# Division of labour with R-CMD-check.yaml: that workflow resolves dependencies
# from DESCRIPTION against current CRAN across six R versions, which is the
# contract a package owes its users. This one restores renv.lock on the single R
# version the lockfile records, which is the contract the repository owes a
# contributor sitting down at a fresh checkout. Neither substitutes for the
# other, and neither is allowed to quietly become the other: R-CMD-check.yaml
# sets RENV_CONFIG_AUTOLOADER_ENABLED=FALSE, this workflow deliberately does not.
#
# The lockfile is snapshot.type = "implicit", so it covers more than DESCRIPTION:
# the data-raw/ derivation scripts that produce inst/extdata are in it too, and
# two of their dependencies (ensurer, zipangu) are no longer on CRAN. This job is
# the only thing that tests that those still resolve.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: renv

permissions: read-all

# Supersede an in-flight run when a PR branch is pushed again: only the newest
# commit's result carries information. Restricted to pull_request so a run on
# the default branch is never cancelled -- that history is what the badge and
# any release audit read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  renv:
    runs-on: ubuntu-latest
    # The default job timeout is 6 hours. r-lib/actions/setup-r@v2 stalled on
    # 2026-08-19 and held runners until that cap, costing 360 runner-minutes per
    # affected repository, so bound the job.
    #
    # 45 minutes rather than the 30 used by R-CMD-check: a cold restore here
    # installs sf and pdftools with their system requirements (GDAL/GEOS/PROJ,
    # poppler), which the check matrix never touches. setup-renv caches the
    # library on the lockfile hash, so only the first run after a renv.lock
    # change pays this. There are no observed times yet; once a few cold runs
    # have gone through, raise the number rather than removing it if a
    # legitimate run exceeds it.
    timeout-minutes: 45

    env:
      # ensurer and zipangu restore from GitHub. Unauthenticated GitHub API
      # requests are rate-limited per runner IP, which fails intermittently
      # rather than consistently -- the worst failure mode to debug.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          # "renv" resolves to the R version recorded in renv.lock. Hardcoding a
          # version alongside a lockfile drifts silently, since the two agreeing
          # today says nothing about tomorrow.
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2
        env:
          # Route restore through pak so system requirements are resolved and
          # apt-installed in the same pass; renv's own installer does not do it.
          RENV_CONFIG_PAK_ENABLED: TRUE

      # A lockfile that restores is not yet a lockfile that describes the
      # project: renv::status() is what catches a package added to DESCRIPTION,
      # to data-raw/, or to _dependencies.R without a snapshot. Left unchecked
      # that drift surfaces later as an unrelated-looking failure on someone
      # else's machine.
      #
      # stopifnot() rather than a message: this must fail the run.
      - name: Verify the lockfile still describes the project
        run: |
          Rscript - <<'RSCRIPT'
          status <- renv::status()
          if (!isTRUE(status$synchronized)) {
            print(status)
            stop(
              "renv.lock is out of sync with the project. ",
              "Run renv::snapshot() locally and commit the result."
            )
          }
          RSCRIPT

      # R CMD check under the pinned library, so "the lockfile restores" is
      # backed by "and the package works in what it restored". rcmdcheck passes
      # .libPaths() through to the check subprocess, and R starts here in the
      # repository root, so .Rprofile has already put the renv library first.
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # No vignettes here, so no --compact-vignettes. --no-manual keeps the
          # run from needing a LaTeX installation.
          build_args: 'c("--no-manual")'
