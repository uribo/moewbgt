# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

# Supersede an in-flight run when a PR branch is pushed again: only the newest
# commit's result carries information. Restricted to pull_request so a run on
# the default branch is never cancelled -- that history is what the badge and
# any release audit read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    # The default job timeout is 6 hours. r-lib/actions/setup-r@v2 stalled on
    # 2026-08-19 and held runners until that cap, costing 360 runner-minutes per
    # affected repository, so bound the job: a hung run should fail fast and be
    # re-runnable rather than read as "still running".
    #
    # 30 minutes, matching jpops: the dependency set here is the same shape --
    # tidyverse plus rvest, no spatial stack and nothing to compile beyond what
    # RSPM already ships as a binary. There are no observed times for this
    # package yet; revisit the bound once a few cold runs have gone through, and
    # raise the number rather than removing it if a legitimate run exceeds it.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: "release"}
          - {os: windows-latest, r: "release"}
          - {os: ubuntu-latest, r: "devel", http-user-agent: "release"}
          - {os: ubuntu-latest, r: "release"}
          - {os: ubuntu-latest, r: "oldrel-1"}
          # DESCRIPTION declares Depends: R (>= 4.1.0). This job is the only
          # thing that tests that bound; drop it and the floor becomes a claim
          # nothing checks.
          - {os: ubuntu-22.04, r: "4.1"}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # This matrix resolves dependencies from DESCRIPTION against current CRAN,
      # which is what CRAN itself does and what the R 4.1 / oldrel-1 / devel jobs
      # are for. renv.lock pins one R version (4.6.1) and one set of package
      # versions; restoring it here would make five of the six jobs test an
      # environment nothing uses, and would silently retire the only check of the
      # declared `Depends: R (>= 4.1.0)` floor.
      #
      # But renv/activate.R is tracked, so every job checks it out, and both
      # setup-r-dependencies and check-r-package start R from the repository
      # root -- which reads .Rprofile, activates renv, and repoints .libPaths()
      # at an empty project library on all six runners. Disabling the autoloader
      # is what keeps this workflow on DESCRIPTION resolution. The variable is
      # read by renv/activate.R itself (see the getenv call there), so it works
      # without renv being installed.
      #
      # The renv.yaml workflow is the one that restores the lockfile; it
      # deliberately does not set this.
      RENV_CONFIG_AUTOLOADER_ENABLED: FALSE

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # No vignettes here, so no --compact-vignettes. --no-manual keeps the
          # run from needing a LaTeX installation.
          build_args: 'c("--no-manual")'
